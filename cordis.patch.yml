# dsh-peakrate bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-peakrate@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-peakrate` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line.
#
# Do NOT also add a manual `- insert: [id: peakrate, ...]` row to the profile's
# own cordis.patch.yml: one plugin must have exactly ONE registration path, or
# boot fails with `duplicate loader entry id: peakrate`.
- insert:
    - id: peakrate
      name: 'dsh-peakrate'
      config:
        enabled: true
        refreshIntervalHours: 24
